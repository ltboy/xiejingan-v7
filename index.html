<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>谢径安 v7 · 未来农业农村概念场景 3D 查看器</title>
<style>
  body { margin:0; overflow:hidden; font-family:-apple-system,sans-serif; background:#111; }
  #app { width:100vw; height:100vh; }
  #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#111; color:#eee; font-size:16px; flex-direction:column; gap:12px; transition:opacity .5s; }
  #bar { width:260px; height:6px; background:#333; border-radius:3px; overflow:hidden; }
  #barfill { width:0%; height:100%; background:#4caf50; transition:width .2s; }
  #hud { position:fixed; top:12px; left:12px; color:#ccc; font-size:13px; background:rgba(0,0,0,.5);
    padding:8px 12px; border-radius:8px; line-height:1.6; }
  #toggle { position:fixed; top:12px; right:12px; padding:8px 14px; border-radius:8px; border:none;
    background:#4caf50; color:#fff; cursor:pointer; font-size:14px; }
  #toggle.off { background:#666; }
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"><div>谢径安 v7 场景加载中…</div><div id="bar"><div id="barfill"></div></div><div id="pct">0%</div></div>
<div id="hud">🖱 拖拽旋转 · 滚轮缩放 · 右键平移</div>
<button id="toggle">自动旋转：开</button>
<script type="importmap">
{ "imports": {
  "three": "https://registry.npmmirror.com/three/0.160.0/files/build/three.module.js",
  "three/addons/": "https://registry.npmmirror.com/three/0.160.0/files/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b5e0);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.5, 20000);
camera.position.set(0, 500, 900);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
app.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x8a7a5a, 1.2);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 2.2);
sun.position.set(800, 1200, 600);
scene.add(sun);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;

const loader = new GLTFLoader();
loader.load('./xiejingan_v7.glb', (gltf) => {
  scene.add(gltf.scene);
  // frame scene
  const box = new THREE.Box3().setFromObject(gltf.scene);
  const c = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(c);
  camera.position.set(c.x + size*0.5, c.z*0 + size*0.35, c.z + size*0.6);
  camera.position.set(c.x + size*0.4, size*0.35, c.z + size*0.5);
  camera.near = size/1000; camera.far = size*10; camera.updateProjectionMatrix();
  const ov = document.getElementById('overlay');
  ov.style.opacity = '0'; setTimeout(()=>ov.remove(), 500);
}, (ev) => {
  if (ev.total) {
    const p = Math.round(ev.loaded/ev.total*100);
    document.getElementById('barfill').style.width = p+'%';
    document.getElementById('pct').textContent = p+'%';
  }
}, (err) => {
  document.getElementById('overlay').innerHTML =
    '<div>加载失败：请用 <code>./serve_viewer.sh</code> 启动本地服务后访问<br>' + err + '</div>';
});

const btn = document.getElementById('toggle');
btn.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btn.textContent = '自动旋转：' + (controls.autoRotate ? '开' : '关');
  btn.classList.toggle('off', !controls.autoRotate);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
